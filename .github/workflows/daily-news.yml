name: Daily News Digest

on:
  schedule:
    # GitHub solo admite UTC en cron. 07:30 UTC = 08:30 en España (invierno, CET).
    # OJO: en verano (CEST, UTC+2) se ejecutará a las 09:30 hora local.
    - cron: '30 7 * * *'
  workflow_dispatch:   # Habilita el botón "Run workflow" para pruebas manuales

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Ejecutar el script de noticias
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python daily_news.py